name: merge-image
description: Combines the per-platform images pushed by `build-app` into a single multi-arch manifest and tags it.
inputs:
  registry:
    required: true
    description: Container registry to push the manifest to
  image:
    required: true
    description: Image name (e.g. `api`)
  registry-username:
    required: true
    description: Username to log in to the container registry
  registry-password:
    required: true
    description: Password to log in to the container registry
  latest:
    required: false
    default: 'false'
    description: If true, also tags the image as `latest` (set when the pushed tag is the newest release)

runs:
  using: composite

  steps:
    # Only this image's digests: `build-app` names its artifacts digests-<image>-<platform>.
    - name: Download digests
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        path: ${{ runner.temp }}/digests/${{ inputs.image }}
        pattern: digests-${{ inputs.image }}-*
        merge-multiple: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: Log in to Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}

    # Image references must be lowercase, but the owner is `OpenShock`.
    - name: Resolve image name
      id: image
      shell: bash
      env:
        IMAGE: ${{ inputs.registry }}/${{ github.repository_owner }}/${{ inputs.image }}
      run: echo "name=${IMAGE,,}" >> "$GITHUB_OUTPUT"

    - name: Extract metadata (tags, annotations) for Docker
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      env:
        # Annotate the manifest list itself so GHCR shows description/source for the multi-arch image.
        DOCKER_METADATA_ANNOTATIONS_LEVELS: index
      with:
        images: ${{ steps.image.outputs.name }}
        flavor: |
          latest=false
        tags: |
          type=raw,value={{branch}},enable=${{ github.ref_type == 'branch' && github.event_name != 'pull_request' }}
          type=raw,value=latest,enable=${{ inputs.latest == 'true' }}
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix=,format=long
          type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') && !startsWith(github.ref, 'refs/tags/0.') }}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}.{{minor}}.{{patch}}

    - name: Create and push multi-arch manifest
      shell: bash
      working-directory: ${{ runner.temp }}/digests/${{ inputs.image }}
      env:
        IMAGE: ${{ steps.image.outputs.name }}
        META_JSON: ${{ steps.meta.outputs.json }}
      run: |
        set -euo pipefail
        args=()
        while IFS= read -r tag; do args+=(-t "$tag"); done < <(jq -r '.tags[]' <<<"$META_JSON")
        while IFS= read -r annotation; do args+=(--annotation "$annotation"); done < <(jq -r '.annotations[]?' <<<"$META_JSON")
        for digest in *; do args+=("$IMAGE@sha256:$digest"); done
        docker buildx imagetools create "${args[@]}"

    - name: Inspect image
      shell: bash
      env:
        IMAGE: ${{ steps.image.outputs.name }}
        VERSION: ${{ steps.meta.outputs.version }}
      run: docker buildx imagetools inspect "$IMAGE:$VERSION"
