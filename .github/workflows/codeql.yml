name: "CodeQL Advanced"

on:
  push:
    branches: [ "develop", "master" ]
  pull_request:
    branches: [ "develop", "master" ]
  schedule:
    - cron: '0 6 * * 1'

env:
  DOTNET_VERSION: 10.x.x

jobs:
  analyze:
    name: Analyze (csharp)
    runs-on: 'ubuntu-latest'
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@c35d1b164463ee62a100735382aaaa525c5d3496 # codeql-bundle-v2.25.6
      with:
        languages: csharp
        build-mode: manual
    
    - name: Setup .NET SDK ${{ env.DOTNET_VERSION }}
      uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Build .NET
      shell: bash
      run: |
        dotnet restore
        dotnet publish API/API.csproj -c Release
        dotnet publish LiveControlGateway/LiveControlGateway.csproj -c Release
        dotnet publish Cron/Cron.csproj -c Release

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@c35d1b164463ee62a100735382aaaa525c5d3496 # codeql-bundle-v2.25.6
      with:
        category: "/language:csharp"
